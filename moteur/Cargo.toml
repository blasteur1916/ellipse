[package]
name = "ellipse-moteur"
version = "0.1.0"
description = "Le moteur d'Ellipse : indexe les fichiers par leur contenu et par leur nom, et y cherche."
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
bzip2 = "0.6.1"
calamine = "0.38.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cxx = "1.0.205"
flate2 = "1.1"
# Hors de Windows, les photos sont décodées par `image` (sous Windows, par WIC) : les formats courants.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6.2"
memchr = "2.8.3"
pdfium-render = "0.9.5"
quick-xml = "0.42.0"
rusqlite.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlite-vec = "0.1.9"
tar = "0.4"
tract-onnx = "0.23.10"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.1", features = ["json"] }
usearch = "2.26.6"
walkdir = "2.5.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Le suivi des disques en direct (inotify sous Linux, FSEvents sur macOS).
notify = "8"
