# Construit Ellipse pour Linux et macOS sur les machines de GitHub, le lance (premier lancement : l'accueil
# s'ouvre) et garde une capture d'écran. Les paquets et les captures sont dans les « artifacts » de chaque
# exécution.
name: Linux et macOS

on:
  workflow_dispatch:
  push:
    branches: [main, linux-macos]

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 : la plus ancienne qui a WebKitGTK 4.1 ; ce qui y est construit marche sur les plus récentes.
          - os: ubuntu-22.04
            paquets: deb,appimage
          # Apple Silicon (l'image la plus récente que GitHub propose).
          - os: macos-latest
            paquets: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf xvfb imagemagick

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Tests du moteur
        run: cargo test -p ellipse-moteur --lib

      - name: Construire
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          # Sans la clé de signature des mises à jour (elle reste sur le PC du projet).
          pnpm tauri build --bundles ${{ matrix.paquets }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Lancer et capturer (Linux)
        if: runner.os == 'Linux'
        env:
          ELLIPSE_TEST: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          ./target/release/ellipse > ellipse.log 2>&1 &
          sleep 20
          import -window root capture-linux.png
          ./target/release/ellipse --ouvrir "chrome" || true
          sleep 5
          import -window root capture-linux-recherche.png
          cat ellipse.log | tail -40

      - name: Lancer et capturer (macOS)
        if: runner.os == 'macOS'
        env:
          ELLIPSE_TEST: "1"
        run: |
          APP=$(ls -d target/release/bundle/macos/*.app | head -1)
          EXE="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          "$EXE" > ellipse.log 2>&1 &
          sleep 20
          screencapture -x capture-macos.png || true
          "$EXE" --ouvrir "safari" || true
          sleep 5
          screencapture -x capture-macos-recherche.png || true
          cat ellipse.log | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellipse-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            capture-*.png
            ellipse.log
          if-no-files-found: warn
